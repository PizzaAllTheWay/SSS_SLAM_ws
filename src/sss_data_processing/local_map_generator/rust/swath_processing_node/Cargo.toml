[package]
name = "swath_processing_node"
version = "0.1.0"
edition = "2021"



[dependencies]
r2r = "0.9.5"
tokio = { version = "1.51.0", features = ["full"] }
futures = "0.3"
nalgebra = "0.34.2"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
ta = "0.5.0"
sysinfo = "0.38.4"



# Include Debugging/Testing/Profiling tools and test pipelines
[[bin]]
name = "test"
path = "test/test.rs"



[profile.release]
debug = true
